name: Native validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - run: julia test/runtests.jl
      - run: julia main.jl 3 fixtures/edges.csv
